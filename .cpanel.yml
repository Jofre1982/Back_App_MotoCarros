---
deployment:
  tasks:
    # APPROOT = carpeta del checkout del repo (cPanel corre las tareas desde aqui).
    # El codigo de Laravel (vendor, bootstrap, storage, .env) vive aqui, NO en public_html.
    - export APPROOT=$(pwd)
    - export DEPLOYPATH=/home/motocar1/public_html
    - export COMPOSER_HOME="${HOME}/.composer"

    # PHP del account (el proyecto requiere >= 8.3). Toma el primero que exista.
    - export PHP=$( for v in ea-php83 ea-php84 ea-php85; do [ -x /opt/cpanel/$v/root/usr/bin/php ] && echo /opt/cpanel/$v/root/usr/bin/php && break; done )
    - if [ -z "$PHP" ]; then export PHP=$(command -v php); fi
    - echo "Usando PHP=$PHP" && $PHP -v

    # Composer no viene preinstalado en este hosting: lo instalamos en ~/bin la 1a vez.
    - mkdir -p "$HOME/bin"
    - if [ ! -f "$HOME/bin/composer" ]; then curl -sS --connect-timeout 20 --max-time 120 https://getcomposer.org/installer -o "$HOME/composer-setup.php" && $PHP "$HOME/composer-setup.php" --install-dir="$HOME/bin" --filename=composer && rm -f "$HOME/composer-setup.php"; fi
    # Ojo: NO usar la variable COMPOSER (composer la reserva como ruta al composer.json).
    - export COMPOSER_BIN="$HOME/bin/composer"
    - $PHP "$COMPOSER_BIN" --version

    # 1) Dependencias de produccion dentro del repo.
    #    --no-scripts: proc_open esta deshabilitado en este hosting, asi que composer
    #    no puede lanzar el subproceso de package:discover. Lo corremos nosotros abajo.
    - $PHP "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress --no-scripts
    - $PHP artisan package:discover --ansi || echo "WARN package-discover fallo, se continua"

    # Generar APP_KEY y JWT_SECRET en el servidor SOLO si estan vacios en .env.
    # Asi los secretos nunca pasan por git ni se escriben a mano, y no se
    # regeneran en cada deploy (eso invalidaria tokens/datos cifrados).
    - if [ -f "$APPROOT/.env" ] && ! grep -q "^APP_KEY=." "$APPROOT/.env"; then $PHP artisan key:generate --force || echo "WARN no se pudo generar APP_KEY"; fi
    - if [ -f "$APPROOT/.env" ] && ! grep -q "^JWT_SECRET=." "$APPROOT/.env"; then $PHP artisan jwt:secret --force || echo "WARN no se pudo generar JWT_SECRET"; fi

    # Limpiar caches ANTES de migrar. Si un deploy anterior cacheo la config
    # (p.ej. apuntando a sqlite cuando aun no existia el .env), migrate y el
    # resto de comandos usarian esa config vieja en vez del .env actual. Esto
    # obliga a leer el .env real (MySQL) en las tareas de abajo.
    - $PHP artisan optimize:clear || echo "WARN optimize-clear fallo, se continua"

    # 2) Migraciones + caches de Laravel (NO bloqueantes mientras MySQL/.env
    #    aun no estan listos: si fallan, se registra el aviso y el deploy sigue).
    #    Ojo YAML: no usar ': ' (dos puntos + espacio) dentro de los echo.
    - $PHP artisan migrate --force || echo "WARN migrate fallo - MySQL/.env aun no listos, se continua"
    - $PHP artisan optimize || echo "WARN optimize fallo, se continua"

    # 3) Publicar SOLO el front controller (contenido de public/) en el DocumentRoot.
    - /bin/cp -R "${APPROOT}/public/." "${DEPLOYPATH}/"

    # 4) Reescribir el index.php copiado para que apunte al codigo real del repo
    #    en vez de usar rutas relativas (__DIR__/../ que no existen en public_html).
    - /bin/sed -i "s#__DIR__\.'/\.\./#'${APPROOT}/#g" "${DEPLOYPATH}/index.php"
