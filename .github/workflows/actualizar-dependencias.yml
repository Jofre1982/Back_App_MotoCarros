name: Actualizar dependencias (temporal)

# Workflow de un solo uso: el contenedor de desarrollo no llega a Packagist,
# asi que `composer update` corre aca y deja el composer.lock en la rama.
# Se borra en el siguiente commit.
on:
  push:
    branches: [chore/actualizar-dependencias]
    paths: [.github/workflows/actualizar-dependencias.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none
      - name: composer update (paquetes con avisos de seguridad)
        run: |
          composer update laravel/framework league/commonmark league/flysystem "symfony/*" \
            --with-all-dependencies --no-interaction --prefer-dist
          composer audit || true
      - name: Guardar composer.lock en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: actualizar dependencias con avisos de seguridad (composer update)" || echo "sin cambios"
          git push
