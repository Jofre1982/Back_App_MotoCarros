openapi: 3.0.3
info:
  title: MotoYa API
  description: >-
    API REST del backend de MotoYa (solicitud de transporte tipo moto-taxi).
    Este archivo es la fuente de verdad del contrato de la API: se actualiza
    en el paso de SDD de cada feature, antes de escribir tests o código (ver
    .claude/skills/laravel-feature-workflow/SKILL.md y .claude/STANDARDS.md).
  version: "0.1.0"
servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Iniciar sesión con email y contraseña
      description: >-
        Autentica una cuenta ya registrada y devuelve un access token. Es el
        mismo endpoint para pasajeros y conductores: el rol no se manda ni se
        elige, viaja de vuelta en `user.role` para que el cliente sepa qué UI
        mostrar.

        El `email` se normaliza a minúsculas antes de buscarlo, igual que en el
        registro (ver .claude/STANDARDS.md): quien se registró como
        `ana@example.com` entra escribiendo `Ana@Example.COM`.

        **Credenciales incorrectas y email no registrado responden exactamente
        lo mismo**: 401 con un mensaje genérico, sin `errors`. Distinguir ambos
        casos convertiría al endpoint en un oráculo para averiguar qué emails
        tienen cuenta, que es el primer paso de un relleno de credenciales.

        No requiere autenticación, y por eso comparte con el resto de endpoints
        de auth el límite de 10 requests por minuto e IP — que acá es además la
        contención principal contra la fuerza bruta sobre contraseñas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: ana@example.com
              password: motoya2026
      responses:
        "200":
          description: Credenciales correctas; sesión iniciada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AuthenticatedUser"
              example:
                data:
                  user:
                    id: 1
                    name: Ana García
                    email: ana@example.com
                    phone: "+573001234567"
                    role: passenger
                  token:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsInJvbGUiOiJwYXNzZW5nZXIifQ.4pcPyMD09olPSyXnrXCjTwXyr4BsezdI1AVTmud2fU4
                    token_type: bearer
                    expires_in: 900
        "401":
          description: >-
            La contraseña no coincide, o el email no corresponde a ninguna
            cuenta. Ambos casos devuelven este mismo cuerpo, palabra por
            palabra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: El email o la contraseña no son correctos.
        "422":
          description: >-
            La entrada está incompleta o malformada: falta `email` o
            `password`, o el email no tiene forma de email. **No** se usa para
            credenciales incorrectas — eso es 401.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The email field is required.
                errors:
                  email:
                    - The email field is required.
        "429":
          description: >-
            Se superó el límite de intentos por minuto para esta IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Cerrar sesión invalidando el access token
      description: >-
        Invalida el access token que viaja en `Authorization: Bearer`, sin
        esperar a que venza por su cuenta. El caso que justifica el endpoint es
        perder el dispositivo o cambiar de teléfono.

        A diferencia del refresh, **no hay periodo de gracia**: el token queda
        inservible en el mismo instante, tanto para consumir la API como para
        renovarse en `/auth/refresh`. La gracia de 30 s existe para que las
        requests en vuelo sobrevivan a una renovación; aplicarla acá dejaría el
        token robado vivo medio minuto más, que es justo lo que quien cierra
        sesión está pidiendo evitar (ver .claude/STANDARDS.md).

        Invalida **solo el token enviado**, no las demás sesiones de la misma
        cuenta: cerrar sesión en el teléfono no debe echar a la tableta. El
        cierre remoto en todos los dispositivos queda fuera de esta historia.

        Lleva `auth:api`, así que un token ausente, ilegible, ya expirado o ya
        cerrado responde 401 — no hay nada que invalidar en ninguno de esos
        casos.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: >-
            Sesión cerrada; el token quedó invalidado. Sin cuerpo: no hay
            ningún recurso que devolver, y el cliente lo único que hace con la
            respuesta es descartar el token que ya tenía.
        "401":
          description: >-
            Falta el access token, es ilegible, ya venció, o ya se había
            cerrado la sesión con él.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "429":
          description: >-
            Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Renovar el access token
      description: >-
        Emite un nuevo access token a partir del token enviado en la cabecera
        `Authorization: Bearer`. A diferencia del resto de endpoints protegidos,
        acepta un token **ya expirado**, siempre que siga dentro de la ventana
        de refresh (`JWT_REFRESH_TTL`, 14 días desde la emisión original). El
        token usado queda invalidado al renovarlo, pero con un periodo de
        gracia de 30 s (`JWT_BLACKLIST_GRACE_PERIOD`) durante el cual sigue
        siendo aceptado, para que las requests que ya iban en vuelo cuando el
        cliente renovó no se caigan (ver .claude/STANDARDS.md).

        El endpoint está limitado a 10 requests por minuto e IP: no lleva
        `auth:api`, así que cualquiera puede invocarlo sin credenciales.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token renovado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AuthToken"
              example:
                data:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsInJvbGUiOiJwYXNzZW5nZXIifQ.4pcPyMD09olPSyXnrXCjTwXyr4BsezdI1AVTmud2fU4
                  token_type: bearer
                  expires_in: 900
        "401":
          description: >-
            Falta el token, es inválido, o el plazo para renovarlo ya venció y
            hay que autenticarse de nuevo con credenciales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Token inválido o expirado. Inicia sesión de nuevo.
        "429":
          description: >-
            Se superó el límite de renovaciones por minuto para esta IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /auth/register/driver:
    post:
      tags:
        - Auth
      operationId: registerDriver
      summary: Registrar una cuenta de conductor
      description: >-
        Crea una cuenta con rol `driver` junto a su perfil de conductor
        (`license_number`) y devuelve, en la misma respuesta, un access token
        válido — igual que el registro de pasajero.

        La cuenta y el perfil se crean de forma atómica: si el número de
        licencia resulta duplicado en la escritura, no queda una cuenta
        huérfana sin perfil.

        El rol **no** se acepta como entrada — lo fija el endpoint. Lo que
        distingue a este registro del de pasajero es exactamente el
        `license_number`; el vehículo se registra aparte (historia #12),
        porque un conductor puede dar de alta su cuenta antes de tener la
        moto cargada.

        La respuesta reutiliza el schema `AuthenticatedUser` del registro de
        pasajero y **no** incluye el `license_number`: el dato del perfil se
        consulta por el endpoint de perfil (historia #10), y así el schema
        `User` no gana un campo que para las cuentas de pasajero siempre
        estaría vacío.

        No requiere autenticación, y por eso comparte con el resto de
        endpoints de auth el límite de 10 requests por minuto e IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverRegistrationRequest"
            example:
              name: Carlos Ramírez
              email: carlos@example.com
              phone: "+573009876543"
              password: motoya2026
              license_number: LIC-445566
      responses:
        "201":
          description: Cuenta de conductor creada, con su perfil, y sesión iniciada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AuthenticatedUser"
              example:
                data:
                  user:
                    id: 1
                    name: Carlos Ramírez
                    email: carlos@example.com
                    phone: "+573009876543"
                    role: driver
                  token:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsInJvbGUiOiJkcml2ZXIifQ.HCJUJDXBM6BAvUcTGF6ZiHR2Wr3ubuRxKh7uBB4Umt4
                    token_type: bearer
                    expires_in: 900
        "422":
          description: >-
            La entrada no pasó la validación: falta un campo requerido, el
            email, el teléfono o el número de licencia ya están registrados,
            o la contraseña no cumple la política mínima.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The license number has already been taken.
                errors:
                  license_number:
                    - The license number has already been taken.
        "429":
          description: >-
            Se superó el límite de requests por minuto para esta IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /auth/register/passenger:
    post:
      tags:
        - Auth
      operationId: registerPassenger
      summary: Registrar una cuenta de pasajero
      description: >-
        Crea una cuenta con rol `passenger` y devuelve, en la misma respuesta,
        un access token válido: la app móvil queda autenticada sin tener que
        encadenar un login inmediatamente después del registro.

        El rol **no** se acepta como entrada — lo fija el endpoint. Registrarse
        como conductor es otro endpoint (historia #7), porque además del rol
        exige los datos del perfil de conductor.

        No requiere autenticación, y por eso comparte con el resto de
        endpoints de auth el límite de 10 requests por minuto e IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassengerRegistrationRequest"
            example:
              name: Ana García
              email: ana@example.com
              phone: "+573001234567"
              password: motoya2026
      responses:
        "201":
          description: Cuenta creada y sesión iniciada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AuthenticatedUser"
              example:
                data:
                  user:
                    id: 1
                    name: Ana García
                    email: ana@example.com
                    phone: "+573001234567"
                    role: passenger
                  token:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsInJvbGUiOiJwYXNzZW5nZXIifQ.4pcPyMD09olPSyXnrXCjTwXyr4BsezdI1AVTmud2fU4
                    token_type: bearer
                    expires_in: 900
        "422":
          description: >-
            La entrada no pasó la validación: falta un campo requerido, el
            email o el teléfono ya están registrados, o la contraseña no
            cumple la política mínima.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The email has already been taken.
                errors:
                  email:
                    - The email has already been taken.
        "429":
          description: >-
            Se superó el límite de requests por minuto para esta IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /broadcasting/auth:
    post:
      tags:
        - Realtime
      operationId: authorizeBroadcastChannel
      summary: Autorizar la suscripción a un canal privado
      description: >-
        Firma la suscripción del cliente a un canal privado de Reverb. El SDK
        del cliente (Laravel Echo / pusher-js) llama a este endpoint por su
        cuenta cada vez que se suscribe a un canal `private-*`, mandando el
        `socket_id` de su conexión con el servidor de WebSockets y el nombre
        del canal.

        La autorización de cada canal está en `routes/channels.php`
        (`ride.{rideId}` y `driver.{driverId}`): responde 403 si el usuario
        autenticado no participa de esa entidad. Requiere un access token
        vigente — a diferencia del refresh, acá el token expirado no sirve.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastAuthRequest"
            example:
              socket_id: "123456.789012"
              channel_name: private-driver.1
      responses:
        "200":
          description: >-
            Suscripción autorizada. La firma se devuelve tal cual la espera el
            cliente (formato del protocolo Pusher que habla Reverb), sin el
            envelope `data` del resto de la API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastAuthResponse"
              example:
                auth: "motoya-local:8f3c1a2b4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7081920a1b2c3d4e5f"
        "401":
          description: Falta el access token o ya no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El usuario autenticado no tiene permiso sobre la entidad del canal
            (no es el conductor de `driver.{id}`, o no participa del viaje de
            `ride.{id}`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /me:
    get:
      tags:
        - Profile
      operationId: showProfile
      summary: Consultar el perfil de la cuenta autenticada
      description: >-
        Devuelve los datos de la cuenta que envió el token. Es lo primero que
        consultan las apps móviles al arrancar, para saber quién es el usuario
        y con qué rol está operando.

        Los datos salen de la base, **no de los claims del token**: el `role`
        del JWT existe solo para que el cliente decida qué UI mostrar sin una
        request extra, y quedó fijado al emitirse. Este endpoint es el que
        responde con el estado actual de la cuenta.

        Para las cuentas de conductor incluye además `driver_profile` con el
        número de licencia. Es el único endpoint que lo devuelve: los registros
        y el login responden el schema `User`, que a propósito no lo tiene
        porque en las cuentas de pasajero estaría siempre vacío (ver la
        decisión de la historia #7 en .claude/STANDARDS.md). En una cuenta de
        pasajero la clave no viene vacía: **no viene**.

        Devuelve siempre el perfil propio. Consultar el de otra persona (los
        datos del conductor asignado, por ejemplo) se resuelve dentro de la
        historia del viaje correspondiente, con lo que ahí corresponda mostrar.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil de la cuenta autenticada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Profile"
              example:
                data:
                  id: 1
                  name: Ana García
                  email: ana@example.com
                  phone: "+573001234567"
                  role: passenger
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
    patch:
      tags:
        - Profile
      operationId: updateProfile
      summary: Actualizar mis datos de contacto
      description: >-
        Actualiza nombre, email y/o teléfono de la cuenta autenticada. Es un
        PATCH parcial: solo los campos presentes en el body se cambian, el
        resto conserva su valor actual.

        No acepta `role` ni ningún otro campo que no sea de contacto — si
        viaja en el body, se ignora: la Action solo lee `name`, `email` y
        `phone` del DTO de entrada, así que no hay ningún camino por el que un
        `role` (o un `id`) mandado por el cliente llegue a aplicarse. Cambio
        de contraseña y de email verificado son historias aparte (ver el
        issue #11).

        Un campo presente no puede venir vacío: `{"email": ""}` responde 422,
        no borra el email. Para dejar un dato como está, no se manda.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            example:
              name: Ana García Pérez
              phone: "+573007654321"
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Profile"
              example:
                data:
                  id: 1
                  name: Ana García Pérez
                  email: ana@example.com
                  phone: "+573007654321"
                  role: passenger
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "422":
          description: >-
            La entrada no pasó la validación: un campo presente vino vacío,
            tiene un formato inválido, o el email/teléfono ya están en uso por
            otra cuenta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The email has already been taken.
                errors:
                  email:
                    - The email has already been taken.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /me/vehicle:
    get:
      tags:
        - Vehicles
      operationId: showVehicle
      summary: Consultar los datos de mi vehículo
      description: >-
        Devuelve la moto ya registrada del conductor que envía el token. Es la
        única forma de leerla fuera del instante en que se acaba de registrar
        o actualizar en la misma sesión: ni `GET /me` ni ningún otro endpoint
        la embeben.

        Cuelga de `/me` como el alta y la actualización: se llega a ella por
        el token, nunca por un id propio. Que no haya id en la ruta es lo que
        hace estructuralmente imposible pedir la moto de otro conductor; la
        propiedad se comprueba igual con `VehiclePolicy`, que es donde vive la
        autorización de negocio.

        Requiere un token vigente y rol `driver`. Un conductor que todavía no
        registró su moto recibe 404, para que el cliente pueda distinguir
        "no tiene vehículo" de un error real.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vehículo de la cuenta autenticada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Vehicle"
              example:
                data:
                  plate: ABC12D
                  model: Bajaj Boxer CT 100
                  year: 2022
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            La cuenta autenticada no es de conductor. No es que le falte
            registrar la moto, es que operar vehículos no es de su rol.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: >-
            La cuenta es de conductor pero todavía no tiene vehículo
            registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: No tienes un vehículo registrado.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
    post:
      tags:
        - Vehicles
      operationId: registerVehicle
      summary: Registrar la moto del conductor autenticado
      description: >-
        Da de alta el vehículo del conductor que envía el token. Un conductor no
        puede recibir solicitudes de viaje hasta tener uno registrado, así que
        este endpoint es el último paso del alta antes de poder trabajar.

        Cuelga de `/me` y no de `/vehicles` porque el vehículo es un
        sub-recurso de la cuenta: se llega a él por el token, nunca por un id
        propio. Por eso tampoco lleva un id en la respuesta (mismo criterio que
        `driver_profile` en `GET /me`).

        **La relación es uno a uno.** Un segundo registro no crea otra moto:
        responde 422 pidiendo que se actualice la existente (historia #13). El
        endpoint es de alta, no de alta-o-reemplazo, para que un cliente que
        reintenta una request que ya había llegado no pise en silencio los datos
        del vehículo con el que el conductor está trabajando.

        La `plate` es única entre todos los conductores y se normaliza a
        mayúsculas antes de validarla y de guardarla, igual que el
        `license_number` del registro de conductor. La API **no** verifica
        contra ninguna entidad externa que la placa exista, que esté vigente ni
        que corresponda a quien la declara.

        Requiere un token vigente y rol `driver`: una cuenta de pasajero recibe
        403, no 422 — no es una entrada malformada, es una operación que su rol
        no tiene.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRegistrationRequest"
            example:
              plate: ABC12D
              model: Bajaj Boxer CT 100
              year: 2022
      responses:
        "201":
          description: Vehículo registrado y asociado a la cuenta del conductor.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Vehicle"
              example:
                data:
                  plate: ABC12D
                  model: Bajaj Boxer CT 100
                  year: 2022
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            La cuenta autenticada no es de conductor. Registrar un vehículo no
            es algo que un pasajero pueda hacer con otros datos, así que no es
            un 422.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "422":
          description: >-
            La entrada no pasó la validación: falta un campo, la placa ya está
            registrada por otro conductor, o esta cuenta ya tiene un vehículo
            —en cuyo caso el error viaja bajo la clave `vehicle`, que no es un
            campo de la entrada sino el estado de la cuenta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The plate has already been taken.
                errors:
                  plate:
                    - The plate has already been taken.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
    patch:
      tags:
        - Vehicles
      operationId: updateVehicle
      summary: Actualizar los datos de mi vehículo
      description: >-
        Actualiza la moto ya registrada del conductor que envía el token: sirve
        para corregir un dato mal cargado o para reflejar un cambio (una placa
        que se rehizo, por ejemplo).

        Es un PATCH parcial, igual que `PATCH /me`: solo los campos presentes
        en el body se cambian, el resto conserva su valor. Un campo presente no
        puede venir vacío — `{"model": ""}` responde 422, no borra el modelo;
        las tres columnas son NOT NULL. La forma de no tocar un dato es no
        mandarlo.

        **No reemplaza el vehículo por otro.** Cambiar de moto —dar de baja la
        actual y registrar una distinta— es otra operación y hoy no existe:
        este endpoint asume que la fila que edita sigue siendo la misma moto.

        Como el alta, cuelga de `/me` porque el vehículo es un sub-recurso de
        la cuenta: se llega a él por el token, nunca por un id propio. Que no
        haya id en la ruta es lo que hace estructuralmente imposible pedir el
        de otro conductor; la propiedad se comprueba igual con `VehiclePolicy`,
        que es donde vive la autorización de negocio y lo que mantiene la
        garantía si algún día el vehículo se direcciona de otra forma.

        La `plate` se normaliza a mayúsculas y sigue siendo única entre todos
        los conductores; reenviar la propia sin cambiarla no responde 422.

        Requiere un token vigente y rol `driver`. Un conductor que todavía no
        registró su moto recibe 404: no hay nada que actualizar, y lo que le
        corresponde es el alta (`POST /me/vehicle`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdateRequest"
            example:
              model: Bajaj Boxer CT 100 ES
              year: 2023
      responses:
        "200":
          description: Vehículo actualizado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Vehicle"
              example:
                data:
                  plate: ABC12D
                  model: Bajaj Boxer CT 100 ES
                  year: 2023
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            La cuenta autenticada no puede operar sobre este vehículo: o no es
            de conductor, o el vehículo no le pertenece. Lo decide
            `VehiclePolicy`, no la ruta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: >-
            La cuenta es de conductor pero todavía no tiene vehículo
            registrado, así que no hay recurso que actualizar. Se responde
            antes que cualquier 422: que el recurso no exista pesa más que la
            forma de la entrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: No tienes un vehículo registrado; regístralo antes de actualizarlo.
        "422":
          description: >-
            La entrada no pasó la validación: un campo presente vino vacío,
            tiene un formato inválido, o la placa ya está registrada por otro
            conductor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The plate has already been taken.
                errors:
                  plate:
                    - The plate has already been taken.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /me/documents:
    get:
      tags:
        - Documents
      operationId: showDriverDocuments
      summary: Consultar el estado de mis documentos de verificación
      description: >-
        Estado de verificación del conductor autenticado: qué documentos ya
        subió, en qué estado quedó cada uno (`pending`, `approved`,
        `rejected`), y el estado general de la cuenta.

        Siempre lista los documentos exigidos hoy (`identidad`,
        `tarjeta_propiedad`) aunque el conductor todavía no haya subido
        alguno — ese documento aparece con `status: null`. Licencia de
        conducción y SOAT no son obligatorios en esta etapa (decisión de
        negocio) y por eso no aparecen en la lista.

        Cuelga de `/me` como el vehículo: se llega por el token, nunca por un
        id propio. Requiere un token vigente y rol `driver`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado de verificación de la cuenta autenticada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/DriverVerification"
              example:
                data:
                  verification_status: pending
                  documents:
                    - type: identidad
                      status: approved
                      rejection_reason: null
                      uploaded_at: "2026-09-04T15:00:00.000000Z"
                    - type: tarjeta_propiedad
                      status: null
                      rejection_reason: null
                      uploaded_at: null
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: La cuenta autenticada no es de conductor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
    post:
      tags:
        - Documents
      operationId: uploadDriverDocument
      summary: Subir (o reemplazar) un documento de verificación
      description: >-
        Sube uno de los documentos de verificación del conductor autenticado:
        `identidad` (cédula, cédula de extranjería o PTP, indistintamente) o
        `tarjeta_propiedad` del motocarro.

        Volver a subir el mismo `type` **reemplaza** el archivo y la fila
        existentes, no los duplica: no es un alta-o-reemplazo condicional
        como el vehículo, es siempre un reemplazo. El documento vuelve a
        quedar `pending` aunque el anterior ya hubiera sido `approved` o
        `rejected` —es un archivo distinto, así que hay que revisarlo de
        nuevo (ver historia técnica #64, revisión por un administrador).

        El archivo se guarda en almacenamiento privado, nunca en una URL
        servida públicamente: son documentos de identidad.

        Requiere un token vigente y rol `driver`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - type
                - file
              properties:
                type:
                  type: string
                  enum: [identidad, tarjeta_propiedad]
                  example: identidad
                file:
                  type: string
                  format: binary
                  description: Imagen (jpg/jpeg/png) o PDF, hasta 5 MB.
      responses:
        "201":
          description: Documento guardado, pendiente de revisión.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/DriverDocument"
              example:
                data:
                  type: identidad
                  status: pending
                  uploaded_at: "2026-09-04T15:00:00.000000Z"
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: La cuenta autenticada no es de conductor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "422":
          description: >-
            La entrada no pasó la validación: falta el archivo o el tipo, el
            tipo no es uno de los exigidos hoy, o el archivo no es una imagen
            o PDF de hasta 5 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "The file must be a file of type: jpg, jpeg, png, pdf."
                errors:
                  file:
                    - "The file must be a file of type: jpg, jpeg, png, pdf."
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /me/availability:
    patch:
      tags:
        - Drivers
      operationId: updateDriverAvailability
      summary: Marcar disponibilidad y ubicación del conductor
      description: >-
        Marca al conductor autenticado disponible o no disponible para recibir
        solicitudes de viaje nuevas cerca de su ubicación (historia #17), y
        opcionalmente actualiza esa ubicación.

        Cuelga de `/me` y no lleva id, igual que `/me/vehicle`: se llega al
        perfil por el token, nunca por un id propio, así que estructuralmente
        no existe forma de tocar la disponibilidad de otro conductor.

        `latitude`/`longitude` son obligatorias cuando `is_available` es
        `true`: sin una ubicación conocida, el conductor no entraría en
        ninguna búsqueda por radio y marcarse disponible no tendría efecto.
        Son opcionales al marcarse no disponible.

        Mientras está disponible, un conductor recibe por el canal privado
        `driver.{id}` un evento `ride.requested` por cada viaje nuevo dentro
        del radio configurado (`RIDES_NEARBY_RADIUS_METERS`), y un evento
        `ride.unavailable` cuando alguno de esos viajes lo acepta otro
        conductor.

        Requiere un token vigente y rol `driver`: una cuenta de pasajero
        recibe 403. Un conductor que todavía no tiene perfil creado recibe
        404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDriverAvailabilityRequest"
            example:
              is_available: true
              latitude: 4.710989
              longitude: -74.072092
      responses:
        "200":
          description: Disponibilidad (y ubicación, si vino) actualizadas.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/DriverProfile"
              example:
                data:
                  license_number: LIC-445566
                  is_available: true
                  latitude: 4.710989
                  longitude: -74.072092
                  location_updated_at: "2026-07-31T10:04:05-05:00"
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            La cuenta autenticada no es de conductor. Marcar disponibilidad no
            es algo que un pasajero pueda hacer con otros datos, así que no es
            un 422.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: >-
            La cuenta es de conductor pero todavía no tiene un perfil
            registrado, así que no hay recurso que actualizar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: No tienes un perfil de conductor; regístrate como conductor antes de marcarte disponible.
        "422":
          description: >-
            La entrada no pasó la validación: falta `is_available`, o falta
            `latitude`/`longitude` (u otra fuera de rango) al marcarse
            disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The latitude field is required when is available is true.
                errors:
                  latitude:
                    - The latitude field is required when is available is true.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /me/rides:
    get:
      tags:
        - Rides
      operationId: listMyRides
      summary: Ver el historial de viajes propios
      description: >-
        Devuelve los viajes de la cuenta autenticada, ordenados del más
        reciente al más antiguo: los que pidió, si es pasajero (historia #29),
        o los que le asignaron, si es conductor (historia #30). Es la vista
        con la que cada cuenta consulta y audita sus viajes pasados; no trae
        filtros por fecha o estado ni exportación — se evalúan como historias
        aparte. Para el conductor, el resumen de ganancias en un rango de
        fechas es un endpoint aparte (`GET /me/earnings`).

        Una cuenta sin viajes previos recibe **200** con `data` en una lista
        vacía, no un error.

        `page` y `per_page` son opcionales y aceptan cualquier entero
        positivo; superar el límite razonable de `per_page` que define el
        backend no responde 422, la respuesta simplemente se acota a ese
        límite.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Página a consultar. Por defecto, la primera.
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: >-
            Cantidad de viajes por página. Por defecto 15; el backend acota
            cualquier valor mayor a un límite razonable en vez de rechazarlo.
          schema:
            type: integer
            minimum: 1
          example: 15
      responses:
        "200":
          description: Página del historial de viajes del pasajero.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ride"
                  meta:
                    type: object
                    description: >-
                      Metadatos de paginación (formato estándar del
                      paginador de Laravel).
                    required:
                      - current_page
                      - per_page
                      - total
                      - last_page
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
              example:
                data:
                  - id: 1
                    status: completed
                    origin:
                      latitude: 4.710989
                      longitude: -74.072092
                    destination:
                      latitude: 4.698
                      longitude: -74.061
                    distance_meters: 7421
                    duration_seconds: 842
                    currency: COP
                    estimated_fare: 8850
                    driver:
                      id: 5
                      name: Carlos Pérez
                    requested_at: "2026-07-31T14:03:21+00:00"
                    started_at: "2026-07-31T14:05:00+00:00"
                    completed_at: "2026-07-31T14:22:00+00:00"
                    final_fare: 9100
                    payment:
                      status: paid
                meta:
                  current_page: 1
                  per_page: 15
                  total: 1
                  last_page: 1
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "422":
          description: >-
            `page` o `per_page` no son enteros positivos (por ejemplo, texto
            o un número negativo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The per page field must be an integer.
                errors:
                  per_page:
                    - The per page field must be an integer.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /me/earnings:
    get:
      tags:
        - Drivers
      operationId: showDriverEarnings
      summary: Ver el resumen de ganancias del conductor en un rango de fechas
      description: >-
        Devuelve cuánto ganó el conductor autenticado en un rango de fechas, y
        cuántos viajes completados componen ese total (historia #30). Es el
        complemento de `GET /me/rides` para hacer seguimiento de ingresos, no
        el detalle viaje por viaje.

        `from` y `to` son obligatorios y se toman como fechas completas (todo
        el día), inclusive en ambos extremos. Solo cuentan los viajes en
        estado `completed` cuyo `completed_at` cae dentro del rango; un viaje
        `cancelled` o todavía activo no suma nada.

        No se hace liquidación ni transferencia real del monto: es solo un
        resumen de lectura, el flujo de pago al conductor queda fuera de
        alcance de esta historia.

        Requiere un token vigente y rol `driver`: una cuenta de pasajero
        recibe 403, mismo criterio que `PATCH /me/availability`.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Fecha inicial del rango (inclusive).
          schema:
            type: string
            format: date
          example: "2026-07-01"
        - name: to
          in: query
          required: true
          description: Fecha final del rango (inclusive).
          schema:
            type: string
            format: date
          example: "2026-07-31"
      responses:
        "200":
          description: Resumen de ganancias del conductor en el rango solicitado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/DriverEarningsSummary"
              example:
                data:
                  from: "2026-07-01"
                  to: "2026-07-31"
                  currency: COP
                  total_earned: 182400
                  completed_rides: 21
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            La cuenta autenticada no es de conductor. El historial de viajes
            del pasajero es la historia #29, con su propio endpoint
            (`GET /me/rides`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "422":
          description: >-
            Falta `from` o `to`, alguna no es una fecha válida, o `from` es
            posterior a `to`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The to field must be a date after or equal to from.
                errors:
                  to:
                    - The to field must be a date after or equal to from.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides:
    post:
      tags:
        - Rides
      operationId: requestRide
      summary: Solicitar un viaje
      description: >-
        Crea la solicitud de viaje del pasajero autenticado entre dos
        coordenadas (historia #15). El viaje nace en estado `requested` y queda
        esperando a que un conductor lo acepte (historia #18): la API no asigna
        conductor por su cuenta.

        Es una operación del rol pasajero y la resuelve `RidePolicy`: una cuenta
        de conductor recibe **403**, no 422, porque no es una entrada que se
        pueda corregir mandando otros datos.

        La distancia, la duración y la tarifa se calculan al crear el viaje con
        el mismo proveedor de mapas y el mismo motor de tarifa que
        `POST /rides/estimate`, y quedan guardadas con el viaje. `estimated_fare`
        sigue siendo un estimado: el monto final se recalcula al completarlo
        (historia #24) con el trayecto realmente recorrido.

        Un pasajero solo puede tener **un viaje activo a la vez** (`requested`,
        `accepted` o `in_progress`); pedir otro mientras tanto responde 422.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideRequest"
            example:
              origin:
                latitude: 4.710989
                longitude: -74.072092
              destination:
                latitude: 4.698
                longitude: -74.061
      responses:
        "201":
          description: El viaje quedó solicitado y espera a que un conductor lo acepte.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Ride"
              example:
                data:
                  id: 1
                  status: requested
                  origin:
                    latitude: 4.710989
                    longitude: -74.072092
                  destination:
                    latitude: 4.698
                    longitude: -74.061
                  distance_meters: 7421
                  duration_seconds: 842
                  currency: COP
                  estimated_fare: 8850
                  driver: null
                  requested_at: "2026-07-31T14:03:21+00:00"
                  started_at: null
                  completed_at: null
                  final_fare: null
                  payment: null
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            La cuenta no es de pasajero. Solicitar un viaje es una operación del
            rol pasajero; un conductor consigue viajes aceptando los que ya
            existen (historia #18).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "422":
          description: >-
            La entrada no pasó la validación (falta una coordenada, está fuera
            de rango, o el destino es el mismo punto que el origen), el pasajero
            ya tiene un viaje activo, o el proveedor de mapas no encontró una
            ruta entre origen y destino (zona sin cobertura).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Ya tienes un viaje en curso; termínalo o cancélalo antes de solicitar otro.
                errors:
                  ride:
                    - Ya tienes un viaje en curso; termínalo o cancélalo antes de solicitar otro.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/estimate:
    post:
      tags:
        - Rides
      operationId: estimateRide
      summary: Ver la tarifa estimada de un viaje antes de solicitarlo
      description: >-
        Le muestra al pasajero cuánto costaría un viaje entre dos coordenadas
        antes de pedirlo (historia #14). No crea nada: es solo una consulta
        contra el proveedor de mapas y el motor de tarifa configurados, con la
        misma fórmula que se usa para cobrar el viaje real. Para solicitar el
        viaje de verdad está `POST /rides` (historia #15), que vuelve a calcular
        estos mismos números y los guarda con el viaje.

        No cuelga de `/me` como el vehículo: no es un sub-recurso de la
        cuenta, es una consulta puntual. Requiere un token vigente igual que
        el resto de la API, y no solo el límite de tasa de los endpoints
        anónimos, porque cada request golpea al proveedor de mapas, que se
        paga por consulta.

        `estimated_fare` no representa un cobro: la respuesta lo marca
        explícitamente con `is_estimate: true`. El monto final del viaje se
        recalcula al completarlo (historia #24) con el trayecto realmente
        recorrido, no con este estimado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideEstimateRequest"
            example:
              origin:
                latitude: 4.710989
                longitude: -74.072092
              destination:
                latitude: 4.698
                longitude: -74.061
      responses:
        "200":
          description: Distancia, duración y tarifa estimadas del trayecto.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/RideEstimate"
              example:
                data:
                  distance_meters: 7421
                  duration_seconds: 842
                  currency: COP
                  estimated_fare: 8850
                  is_estimate: true
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "422":
          description: >-
            La entrada no pasó la validación (falta una coordenada o está
            fuera de rango), o el proveedor de mapas no encontró una ruta
            entre origen y destino (zona sin cobertura).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The origin.latitude field must be between -90 and 90.
                errors:
                  origin.latitude:
                    - The origin.latitude field must be between -90 and 90.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/{id}:
    get:
      tags:
        - Rides
      operationId: showRide
      summary: Ver el estado actual de un viaje
      description: >-
        Devuelve el estado del viaje y, si ya lo aceptó alguien, quién es el
        conductor asignado (historia #21). Es la consulta puntual que
        acompaña al canal privado `ride.{id}`: el seguimiento en vivo llega
        por el canal, y este endpoint es el que responde "¿en qué punto está
        mi viaje?" cuando el cliente arranca, vuelve del segundo plano o
        perdió la conexión al canal.

        Lo puede consultar el pasajero dueño del viaje y el conductor
        asignado —los mismos dos que entran al canal—; cualquier otra cuenta
        recibe **403**.

        Mientras el viaje sigue en `requested` no hay conductor todavía y
        `driver` vale `null`. Tampoco hay ubicación que mostrar en ese punto,
        y no porque el campo falte: la posición del conductor no viaja nunca
        por esta respuesta, solo por el evento `location.updated` del canal,
        que publica el conductor asignado (historia #20). Sin conductor no hay
        nadie publicándola.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del viaje a consultar.
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: El estado actual del viaje.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Ride"
              example:
                data:
                  id: 1
                  status: requested
                  origin:
                    latitude: 4.710989
                    longitude: -74.072092
                  destination:
                    latitude: 4.698
                    longitude: -74.061
                  distance_meters: 7421
                  duration_seconds: 842
                  currency: COP
                  estimated_fare: 8850
                  driver: null
                  requested_at: "2026-07-31T14:03:21+00:00"
                  started_at: null
                  completed_at: null
                  final_fare: null
                  payment: null
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El viaje no es de la cuenta autenticada: ni lo pidió ni está
            asignada a él como conductor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: No existe ningún viaje con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "No query results for model [App\\Models\\Ride] 1."
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/{id}/cancel:
    post:
      tags:
        - Rides
      operationId: cancelRide
      summary: Cancelar un viaje solicitado o ya aceptado
      description: >-
        Mismo endpoint para dos operaciones distintas según quién lo llama:

        **El pasajero dueño del viaje** lo cancela, ya sea que siga en
        `requested` (historia #16) o que un conductor ya lo haya aceptado en
        `accepted` (historia #22). En ambos casos el viaje pasa a
        `cancelled`, y la respuesta incluye `cancellation_fee_applies`:
        `false` cuando todavía no había conductor asignado, y `true` cuando
        ya lo había, porque ese conductor ya se había comprometido y
        desplazado hacia el punto de recogida. El cálculo y cobro efectivo de
        esa penalización, si aplica, se procesan en el flujo de pagos — acá
        solo se indica si corresponde.

        **El conductor asignado** cancela un viaje que aceptó pero todavía no
        inició, es decir en `accepted` (historia #23). El viaje **no** se
        cancela: vuelve a `requested` sin conductor asignado, para que otros
        conductores puedan aceptarlo. La respuesta es el viaje ya sin
        `driver` y sin el campo `cancellation_fee_applies` — no aplica
        ningún cargo, porque el viaje sigue en pie para el pasajero. El
        sistema registra internamente el conteo de cancelaciones del
        conductor para uso futuro en políticas de calidad; no se expone en
        esta respuesta ni bloquea la operación.

        Un viaje `in_progress`, `completed` o ya `cancelled` no se puede
        cancelar por este endpoint, sin importar quién lo pida.

        Solo el pasajero dueño del viaje o el conductor asignado pueden
        llamar a este endpoint: cualquier otra cuenta recibe **403**. Que el
        viaje no esté en un estado cancelable es en cambio **422**, porque no
        es un problema de permisos sino de en qué punto del ciclo de vida
        está el viaje.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del viaje a cancelar.
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: >-
            El viaje quedó `cancelled` (si cancela el pasajero) o volvió a
            `requested` sin conductor asignado (si cancela el conductor) —
            ver la descripción del endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Ride"
                      - type: object
                        properties:
                          cancellation_fee_applies:
                            type: boolean
                            description: >-
                              Si esta cancelación generó una penalización por
                              cancelación tardía (historia #22): `true` cuando
                              el viaje ya tenía conductor asignado
                              (`accepted`), `false` cuando todavía estaba
                              `requested`. El cálculo y cobro efectivo del
                              cargo, si aplica, se procesan en el flujo de
                              pagos, fuera de alcance de este endpoint.

                              Ausente cuando quien cancela es el conductor
                              asignado (historia #23): ese caso no cancela el
                              viaje ni genera cargo, solo lo devuelve al pool
                              sin conductor.
                            example: true
              example:
                data:
                  id: 1
                  status: cancelled
                  origin:
                    latitude: 4.710989
                    longitude: -74.072092
                  destination:
                    latitude: 4.698
                    longitude: -74.061
                  distance_meters: 7421
                  duration_seconds: 842
                  currency: COP
                  estimated_fare: 8850
                  driver: null
                  requested_at: "2026-07-31T14:03:21+00:00"
                  started_at: null
                  completed_at: null
                  final_fare: null
                  payment: null
                  cancellation_fee_applies: true
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El viaje no pertenece al pasajero autenticado ni está asignado al
            conductor autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: No existe ningún viaje con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "No query results for model [App\\Models\\Ride] 1."
        "422":
          description: >-
            El viaje no está en un estado cancelable por este endpoint: está
            `in_progress`, ya se `completed`, o ya se había `cancelled`
            antes. Aplica igual sin importar si quien cancela es el pasajero
            o el conductor asignado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: El viaje está en curso; no se puede cancelar de esta forma.
                errors:
                  ride:
                    - El viaje está en curso; no se puede cancelar de esta forma.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/{id}/accept:
    post:
      tags:
        - Rides
      operationId: acceptRide
      summary: Aceptar una solicitud de viaje disponible
      description: >-
        Asigna el viaje al conductor autenticado mientras sigue en
        `requested` (historia #18). Dos conductores pueden intentar aceptar
        el mismo viaje casi al mismo tiempo: solo el primero en llegar lo
        consigue, y el resto recibe **409** porque el viaje ya no está
        disponible.

        Solo un conductor puede aceptar viajes: un pasajero recibe **403**.
        Que el conductor ya tenga un viaje propio activo (`accepted` o
        `in_progress`) es en cambio **422**, porque el permiso lo tiene y lo
        que le falta es terminar o cancelar el que ya tiene.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del viaje a aceptar.
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: El viaje quedó asignado al conductor autenticado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Ride"
              example:
                data:
                  id: 1
                  status: accepted
                  origin:
                    latitude: 4.710989
                    longitude: -74.072092
                  destination:
                    latitude: 4.698
                    longitude: -74.061
                  distance_meters: 7421
                  duration_seconds: 842
                  currency: COP
                  estimated_fare: 8850
                  driver:
                    id: 42
                    name: Carlos Pérez
                  requested_at: "2026-07-31T14:03:21+00:00"
                  started_at: null
                  completed_at: null
                  final_fare: null
                  payment: null
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: La cuenta autenticada no es de un conductor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: No existe ningún viaje con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "No query results for model [App\\Models\\Ride] 1."
        "409":
          description: >-
            El viaje ya no está disponible: otro conductor lo aceptó
            primero, o cambió de estado por otro motivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Este viaje ya no está disponible.
        "422":
          description: El conductor autenticado ya tiene un viaje propio activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Ya tienes un viaje activo; termínalo o cancélalo antes de aceptar otro.
                errors:
                  ride:
                    - Ya tienes un viaje activo; termínalo o cancélalo antes de aceptar otro.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/{id}/start:
    post:
      tags:
        - Rides
      operationId: startRide
      summary: Iniciar un viaje aceptado
      description: >-
        Marca como iniciado el viaje que el conductor autenticado ya había
        aceptado (historia #19): el viaje pasa de `accepted` a `in_progress` y
        queda registrada la hora de inicio en `started_at`. Es la transición
        entre "el conductor va en camino" y "el viaje está en curso", y es lo
        que habilita el seguimiento de la ubicación para el pasajero.

        Solo el conductor **asignado a ese viaje** puede iniciarlo: cualquier
        otra cuenta —otro conductor, o el pasajero— recibe **403**. Que el
        viaje no esté en `accepted` (ya está en curso, se completó o se
        canceló) es en cambio **422**, porque el permiso lo tiene y lo que no
        corresponde es la transición.

        La API **no verifica por geolocalización** que el conductor esté
        realmente en el punto de recogida; queda explícitamente fuera de esta
        historia.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del viaje a iniciar.
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: El viaje quedó en curso.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Ride"
              example:
                data:
                  id: 1
                  status: in_progress
                  origin:
                    latitude: 4.710989
                    longitude: -74.072092
                  destination:
                    latitude: 4.698
                    longitude: -74.061
                  distance_meters: 7421
                  duration_seconds: 842
                  currency: COP
                  estimated_fare: 8850
                  driver:
                    id: 42
                    name: Carlos Pérez
                  requested_at: "2026-07-31T14:03:21+00:00"
                  started_at: "2026-07-31T14:09:05+00:00"
                  completed_at: null
                  final_fare: null
                  payment: null
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El viaje no está asignado a la cuenta autenticada (o la cuenta no
            es de un conductor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: No existe ningún viaje con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "No query results for model [App\\Models\\Ride] 1."
        "422":
          description: >-
            El viaje no está en `accepted`: ya está en curso, se completó o se
            canceló.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Solo se puede iniciar un viaje que esté aceptado.
                errors:
                  ride:
                    - Solo se puede iniciar un viaje que esté aceptado.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/{id}/complete:
    post:
      tags:
        - Rides
      operationId: completeRide
      summary: Completar un viaje en curso
      description: >-
        Marca como completado el viaje que el conductor autenticado tiene en
        curso (historia #24): el viaje pasa de `in_progress` a `completed`,
        queda registrada la hora de finalización en `completed_at`, y se
        recalcula la tarifa final en `final_fare` a partir del trayecto
        realmente recorrido —la distancia cotizada al pedir el viaje y la
        duración real transcurrida desde `started_at`— usando la misma
        fórmula que la tarifa estimada (ver "Cálculo de tarifas" en
        .claude/STANDARDS.md).

        Solo el conductor **asignado a ese viaje** puede completarlo:
        cualquier otra cuenta —otro conductor, o el pasajero— recibe
        **403**. Que el viaje no esté en `in_progress` (todavía no arrancó,
        ya se completó o se canceló) es en cambio **422**, porque el permiso
        lo tiene y lo que no corresponde es la transición.

        Completar el viaje también dispara su cobro (historia #25) por
        `final_fare`, publicado en `payment`. Que el proveedor de pago
        rechace el cobro no revierte la finalización ni responde un error:
        el viaje igual queda `completed` y `payment.status` queda en
        `failed` — el conductor ya hizo el trayecto, y un cobro que no se
        pudo procesar se resuelve aparte, no reabriendo el viaje.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del viaje a completar.
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: El viaje quedó completado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Ride"
              example:
                data:
                  id: 1
                  status: completed
                  origin:
                    latitude: 4.710989
                    longitude: -74.072092
                  destination:
                    latitude: 4.698
                    longitude: -74.061
                  distance_meters: 7421
                  duration_seconds: 842
                  currency: COP
                  estimated_fare: 8850
                  driver:
                    id: 42
                    name: Carlos Pérez
                  requested_at: "2026-07-31T14:03:21+00:00"
                  started_at: "2026-07-31T14:09:05+00:00"
                  completed_at: "2026-07-31T14:19:05+00:00"
                  final_fare: 8450
                  payment:
                    status: paid
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El viaje no está asignado a la cuenta autenticada (o la cuenta no
            es de un conductor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: No existe ningún viaje con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "No query results for model [App\\Models\\Ride] 1."
        "422":
          description: >-
            El viaje no está en `in_progress`: todavía no arrancó, ya se
            completó o se canceló.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Solo se puede completar un viaje que esté en curso.
                errors:
                  ride:
                    - Solo se puede completar un viaje que esté en curso.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/{id}/location:
    post:
      tags:
        - Rides
      operationId: shareRideLocation
      summary: Publicar la ubicación del conductor durante el viaje
      description: >-
        Publica la posición actual del conductor en el canal privado
        `ride.{rideId}` (historia #20), para que el pasajero pueda seguir el
        progreso del viaje en tiempo real (historia #21).

        Solo el conductor **asignado a ese viaje** puede publicar su
        ubicación: cualquier otra cuenta —otro conductor, o el pasajero—
        recibe **403**. Que el viaje no esté en `in_progress` es en cambio
        **422**, porque el permiso lo tiene y lo que no corresponde es la
        transmisión en ese punto del ciclo de vida.

        No persiste un historial de coordenadas: solo transmite la posición
        en vivo a quien esté suscrito al canal en ese momento. Responde
        **204** y no un API Resource porque no hay ningún recurso que
        devolver (ver .claude/STANDARDS.md, "Envelope de las respuestas").
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del viaje en curso.
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Coordinates"
            example:
              latitude: 4.706
              longitude: -74.068
      responses:
        "204":
          description: >-
            La ubicación se publicó en el canal `ride.{rideId}`. Sin cuerpo:
            no hay ningún recurso que devolver.
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El viaje no está asignado a la cuenta autenticada (o la cuenta no
            es de un conductor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: No existe ningún viaje con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "No query results for model [App\\Models\\Ride] 1."
        "422":
          description: >-
            La latitud/longitud está fuera de rango, o el viaje no está
            `in_progress`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Solo se puede compartir ubicación en un viaje en curso.
                errors:
                  ride:
                    - Solo se puede compartir ubicación en un viaje en curso.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/{id}/receipt:
    get:
      tags:
        - Rides
      operationId: showRideReceipt
      summary: Ver el recibo de un viaje completado
      description: >-
        Devuelve el desglose del cobro de un viaje completado (historia
        #26): tarifa base, distancia, tiempo, espera y el monto total, para
        que el pasajero pueda verificar cuánto se le cobró y por qué
        concepto.

        Solo el pasajero **dueño** del viaje puede verlo: a diferencia de
        `GET /rides/{id}`, el conductor asignado también recibe **403** —el
        recibo es lo que se le cobró al pasajero, no un dato del viaje en
        sí. Que el viaje no esté `completed`, o que todavía no tenga un
        pago procesado, es en cambio **422**: el permiso lo tiene, lo que
        falta es que el ciclo de vida llegue a ese punto.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del viaje completado.
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: El recibo del viaje.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/RideReceipt"
              example:
                data:
                  ride_id: 1
                  currency: COP
                  base_fare: 1500
                  distance_fare: 5937
                  time_fare: 1000
                  waiting_fee: 0
                  subtotal: 8437
                  minimum_applied: false
                  total: 8450
                  payment_status: paid
                  completed_at: "2026-07-31T14:19:05+00:00"
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El viaje no le pertenece a la cuenta autenticada (incluye al
            conductor asignado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: No existe ningún viaje con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "No query results for model [App\\Models\\Ride] 1."
        "422":
          description: >-
            El viaje no está `completed`, o todavía no tiene un pago
            procesado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: El recibo todavía no está disponible para este viaje.
                errors:
                  ride:
                    - El recibo todavía no está disponible para este viaje.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /rides/{id}/rate-driver:
    post:
      tags:
        - Rides
      operationId: rateDriver
      summary: Calificar al conductor al finalizar el viaje
      description: >-
        Registra la calificación que el pasajero da al conductor de un viaje
        ya completado (historia #27): una puntuación de 1 a 5 y un comentario
        opcional, asociados al viaje y al conductor asignado.

        Solo el pasajero **dueño** del viaje puede calificarlo: cualquier
        otra cuenta —el conductor asignado u otro pasajero— recibe **403**.
        Que el viaje no esté `completed`, o que el pasajero ya lo haya
        calificado antes, es en cambio **422**: el permiso lo tiene, lo que
        falla es el momento del ciclo de vida o que ya no queda nada por
        registrar.

        No calcula ni expone el promedio de calificación del conductor; eso
        se cubre en una historia aparte.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del viaje completado a calificar.
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - score
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Puntuación de 1 (peor) a 5 (mejor).
                  example: 5
                comment:
                  type: string
                  nullable: true
                  description: Comentario libre y opcional sobre el servicio.
                  example: Muy puntual y buen trato.
            example:
              score: 5
              comment: Muy puntual y buen trato.
      responses:
        "201":
          description: La calificación quedó registrada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/RideRating"
              example:
                data:
                  ride_id: 1
                  score: 5
                  comment: Muy puntual y buen trato.
                  rated_at: "2026-07-31T14:20:05+00:00"
        "401":
          description: Falta el access token, es ilegible o ya venció.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El viaje no le pertenece a la cuenta autenticada (incluye al
            conductor asignado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "404":
          description: No existe ningún viaje con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "No query results for model [App\\Models\\Ride] 1."
        "422":
          description: >-
            El viaje no está `completed`, la puntuación está fuera de 1 a 5,
            o el pasajero ya calificó a este conductor por este viaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Ya existe una calificación del conductor para este viaje.
                errors:
                  ride:
                    - Ya existe una calificación del conductor para este viaje.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthToken:
      type: object
      description: >-
        Access token JWT emitido por la API. Viaja dentro del envelope `data`
        que agregan los API Resources de Laravel (ver .claude/STANDARDS.md).
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: "JWT firmado que el cliente envía en la cabecera `Authorization: Bearer`."
        token_type:
          type: string
          enum:
            - bearer
        expires_in:
          type: integer
          nullable: true
          description: >-
            Segundos que faltan para que el access token expire, calculados
            sobre el claim `exp` del token emitido. Es `null` cuando el token
            no expira (`JWT_TTL` sin valor).
          example: 900
    User:
      type: object
      description: >-
        Datos públicos de una cuenta. Nunca incluye la contraseña (el modelo la
        declara en `$hidden`).
      required:
        - id
        - name
        - email
        - phone
        - role
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ana García
        email:
          type: string
          format: email
          example: ana@example.com
        phone:
          type: string
          example: "+573001234567"
        role:
          type: string
          description: >-
            Rol de autenticación de la cuenta (ver la decisión de modelo de
            datos en .claude/STANDARDS.md). Sirve para que el cliente sepa qué
            UI mostrar; la autorización de negocio se resuelve con Policies en
            el servidor, no con este campo.
          enum:
            - passenger
            - driver
          example: passenger
    AuthenticatedUser:
      type: object
      description: >-
        Cuenta más el access token con el que quedó autenticada. Es la
        respuesta común del registro y del login.
      required:
        - user
        - token
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          $ref: "#/components/schemas/AuthToken"
    DriverProfile:
      type: object
      description: >-
        Datos que solo existen para una cuenta de conductor: la licencia
        (historia #12) y la disponibilidad/ubicación para recibir solicitudes
        de viaje cercanas (historia #17); los documentos del vehículo son otra
        entidad y se registran aparte.
      required:
        - license_number
        - is_available
        - latitude
        - longitude
        - location_updated_at
      properties:
        license_number:
          type: string
          description: >-
            Número de la licencia tal como quedó guardado en el registro, en su
            forma canónica (mayúsculas, sin espacios al borde). La API no
            verifica contra ninguna entidad externa que exista ni que esté
            vigente: devuelve lo que el conductor declaró.
          example: LIC-445566
        is_available:
          type: boolean
          description: >-
            Si el conductor está marcado como disponible para recibir
            solicitudes de viaje cercanas por el canal `driver.{id}` (historia
            #17). `false` por defecto: recién registrado, ningún conductor
            está trabajando todavía.
          example: true
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: >-
            Última posición conocida mientras está disponible. `null` si
            todavía no la compartió.
          example: 4.710989
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          example: -74.072092
        location_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se actualizó la posición por última vez. `null` si nunca se compartió.
          example: "2026-07-31T10:04:05-05:00"
    UpdateDriverAvailabilityRequest:
      type: object
      description: >-
        Disponibilidad (y opcionalmente ubicación) que el conductor
        autenticado publica para recibir solicitudes de viaje cercanas
        (historia #17).
      required:
        - is_available
      properties:
        is_available:
          type: boolean
          description: Si el conductor puede recibir solicitudes de viaje cercanas en este momento.
          example: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: >-
            Obligatoria cuando `is_available` es `true`: sin ubicación, el
            conductor no entraría en ninguna búsqueda por radio. Opcional al
            marcarse no disponible.
          example: 4.710989
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -74.072092
    Profile:
      description: >-
        Cuenta autenticada vista por su dueño. Es el schema `User` más lo que
        depende del rol, y por eso está separado de él: `User` es lo que
        devuelven el login y los registros, donde un `driver_profile` no tendría
        sentido.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            driver_profile:
              allOf:
                - $ref: "#/components/schemas/DriverProfile"
              description: >-
                Presente solo en cuentas con rol `driver` que ya tienen su
                perfil creado. En una cuenta de pasajero la clave se omite
                entera, en vez de venir como `null`: no es un dato que falte,
                es un dato que no aplica.
    UpdateProfileRequest:
      type: object
      description: >-
        Datos de contacto que el dueño de la cuenta puede actualizar. Todos
        los campos son opcionales: solo los que vienen en la request se
        cambian, el resto queda como estaba. No lleva `role` ni `id` a
        propósito — el rol no se acepta como entrada acá tampoco, así que no
        hay forma de escalar de pasajero a conductor (u otro usuario) por
        esta vía.

        **Opcional no es vaciable.** Un campo que viene tiene que traer un
        valor: `minLength: 1` en los tres. La forma de no cambiar un dato es
        no mandarlo, no mandarlo vacío — la cuenta necesita email y teléfono
        para iniciar sesión y para que la contacten, y ninguno de los dos
        admite `null` en la base.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Ana García Pérez
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: >-
            Se normaliza a minúsculas antes de validar, igual que en el
            registro. Cambiarlo a uno ya usado por otra cuenta responde 422.
          example: ana.garcia@example.com
        phone:
          type: string
          minLength: 1
          description: >-
            Mismo formato y normalización que en el registro (`+` opcional en
            la entrada, se guarda siempre con él). Cambiarlo a uno ya usado
            por otra cuenta responde 422.
          example: "+573007654321"
    Vehicle:
      type: object
      description: >-
        La moto con la que trabaja un conductor. Relación uno a uno con la
        cuenta.

        No lleva `id` ni `user_id`, por el mismo criterio que `DriverProfile`:
        se llega al vehículo por la cuenta que envía el token, nunca por un id
        propio, así que publicarlos solo invitaría a intentar direccionarlo por
        ahí.
      required:
        - plate
        - model
        - year
      properties:
        plate:
          type: string
          description: >-
            Placa tal como quedó guardada, en su forma canónica (mayúsculas,
            sin espacios al borde).
          example: ABC12D
        model:
          type: string
          description: Modelo declarado por el conductor, texto libre.
          example: Bajaj Boxer CT 100
        year:
          type: integer
          description: Año del modelo.
          example: 2022
    DriverDocument:
      type: object
      description: >-
        Un documento de verificación recién subido por un conductor. No lleva
        `id` ni `driver_profile_id`, mismo criterio que `Vehicle`: se llega a
        él por la cuenta que envía el token, nunca por un id propio.
      required:
        - type
        - status
        - uploaded_at
      properties:
        type:
          type: string
          enum: [identidad, tarjeta_propiedad]
          example: identidad
        status:
          type: string
          enum: [pending, approved, rejected]
          example: pending
        uploaded_at:
          type: string
          format: date-time
          example: "2026-09-04T15:00:00.000000Z"
    DriverVerification:
      type: object
      description: >-
        Estado de verificación de un conductor: el general de la cuenta y el
        detalle de cada documento exigido hoy (`identidad`,
        `tarjeta_propiedad`), lo haya subido o no.
      required:
        - verification_status
        - documents
      properties:
        verification_status:
          type: string
          enum: [pending, verified, rejected]
          description: >-
            `verified` solo cuando **todos** los documentos exigidos están
            `approved`. Pasa a `rejected` en cuanto un administrador rechaza
            cualquiera de ellos (ver historia técnica #64).
          example: pending
        documents:
          type: array
          items:
            type: object
            required:
              - type
              - status
              - rejection_reason
              - uploaded_at
            properties:
              type:
                type: string
                enum: [identidad, tarjeta_propiedad]
                example: identidad
              status:
                type: string
                enum: [pending, approved, rejected]
                nullable: true
                description: "`null` si el conductor todavía no subió este documento."
                example: approved
              rejection_reason:
                type: string
                nullable: true
                example: null
              uploaded_at:
                type: string
                format: date-time
                nullable: true
                example: "2026-09-04T15:00:00.000000Z"
    LoginRequest:
      type: object
      description: >-
        Credenciales con las que una cuenta ya registrada inicia sesión. No
        lleva rol: el mismo endpoint sirve a pasajeros y conductores.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: >-
            Email de la cuenta. Se normaliza a minúsculas antes de buscarla,
            igual que en el registro, así que la capitalización con la que se
            escriba es indiferente.
          example: ana@example.com
        password:
          type: string
          format: password
          description: >-
            Contraseña en claro. A diferencia del registro, acá **no** se
            valida contra la política mínima de contraseñas: hacerlo
            respondería 422 en vez de 401 a una contraseña que no la cumple, y
            esa diferencia de código de estado delataría cuál de los dos campos
            falló. Una contraseña que no cumple la política simplemente no
            coincide con ninguna cuenta.


            La única forma que sí se rechaza con 422 es el byte nulo
            (`U+0000`), que bcrypt no puede hashear y que por lo tanto tampoco
            puede ser la contraseña de ninguna cuenta: ese 422 no depende de qué
            haya en la base. Tampoco hay `maxLength`, para no dejar afuera a una
            cuenta registrada con una contraseña más larga que el tope.
          pattern: "^[^\\u0000]*$"
          example: motoya2026
    DriverRegistrationRequest:
      type: object
      description: >-
        Datos con los que se da de alta un conductor. El rol no se manda: lo
        fija el endpoint.

        Repite los campos de cuenta de `PassengerRegistrationRequest` en vez
        de componerse sobre él: son dos altas distintas que hoy coinciden en
        cuatro campos, y el registro de conductor es el que va a crecer
        (documentos, verificación de licencia) sin arrastrar al de pasajero.
      required:
        - name
        - email
        - phone
        - password
        - license_number
      properties:
        name:
          type: string
          maxLength: 255
          example: Carlos Ramírez
        email:
          type: string
          format: email
          maxLength: 255
          description: >-
            Único entre todas las cuentas, sin importar el rol. Se normaliza a
            minúsculas antes de validarlo y de guardarlo.
          example: carlos@example.com
        phone:
          type: string
          maxLength: 20
          description: >-
            Único entre todas las cuentas, sin importar el rol. Se acepta en
            formato E.164 (`+` y de 7 a 15 dígitos); el `+` es opcional en la
            entrada, pero el número se guarda y se devuelve siempre con él.
          example: "+573009876543"
        password:
          type: string
          format: password
          minLength: 8
          description: >-
            Mínimo 8 caracteres, con al menos una letra y al menos un número
            (ver la política en .claude/STANDARDS.md).
          example: motoya2026
        license_number:
          type: string
          minLength: 5
          maxLength: 50
          description: >-
            Número de la licencia de conducir, único entre todos los
            conductores. Se normaliza a mayúsculas y sin espacios antes de
            validarlo y de guardarlo, así que `lic-445566` y `LIC-445566` son
            la misma licencia y la segunda alta responde 422. Solo se admiten
            letras, dígitos y guiones.

            La API **no** verifica que la licencia exista de verdad ni que
            esté vigente contra ninguna entidad externa: registra el dato tal
            como lo declara el conductor.
          pattern: "^[A-Z0-9-]{5,50}$"
          example: LIC-445566
    PassengerRegistrationRequest:
      type: object
      description: >-
        Datos con los que se da de alta un pasajero. El rol no se manda: lo
        fija el endpoint.
      required:
        - name
        - email
        - phone
        - password
      properties:
        name:
          type: string
          maxLength: 255
          example: Ana García
        email:
          type: string
          format: email
          maxLength: 255
          description: >-
            Único entre todas las cuentas. Se normaliza a minúsculas antes de
            validarlo y de guardarlo, así que `Ana@example.com` y
            `ana@example.com` son la misma cuenta (la segunda alta responde
            422).
          example: ana@example.com
        phone:
          type: string
          maxLength: 20
          description: >-
            Único entre todas las cuentas. Se acepta en formato E.164 (`+` y
            de 7 a 15 dígitos); el `+` es opcional en la entrada, pero el
            número se guarda y se devuelve siempre con él. Es decir,
            `573001234567` y `+573001234567` son el mismo número y el segundo
            registro responde 422.
          example: "+573001234567"
        password:
          type: string
          format: password
          minLength: 8
          description: >-
            Mínimo 8 caracteres, con al menos una letra y al menos un número
            (ver la política en .claude/STANDARDS.md).
          example: motoya2026
    VehicleRegistrationRequest:
      type: object
      description: >-
        Datos con los que un conductor da de alta su moto. No lleva a quién
        pertenece: el dueño es siempre la cuenta que envía el token.
      required:
        - plate
        - model
        - year
      properties:
        plate:
          type: string
          minLength: 5
          maxLength: 10
          description: >-
            Placa del vehículo, única entre todos los conductores. Se normaliza
            a mayúsculas y sin espacios al borde antes de validarla y de
            guardarla, así que `abc12d` y `ABC12D` son la misma placa y la
            segunda alta responde 422. Solo se admiten letras, dígitos y
            guiones; los espacios interiores **no** se limpian, porque
            `ABC 12D` es una placa mal escrita y corresponde un 422 explicable
            en vez de que el servidor adivine cómo debería haberse escrito.

            La API no verifica contra ninguna entidad externa que la placa
            exista, que esté vigente ni que corresponda a quien la declara:
            registra lo que el conductor dice, igual que con el número de
            licencia.
          pattern: "^[A-Z0-9-]{5,10}$"
          example: ABC12D
        model:
          type: string
          maxLength: 100
          description: >-
            Modelo de la moto, texto libre: no hay catálogo de marcas ni
            modelos, y fabricar uno para un dato que hoy solo sirve para que el
            pasajero reconozca la moto que lo recoge sería inventar un problema.
          example: Bajaj Boxer CT 100
        year:
          type: integer
          minimum: 1970
          description: >-
            Año del modelo, de cuatro dígitos. El máximo es el año en curso más
            uno —los modelos se venden adelantados al calendario— y por eso no
            se fija acá como número: quedaría desactualizado cada enero.

            Los límites existen para atajar el dedazo (`2205`, `19999`), no para
            declarar una antigüedad máxima de la flota; si el negocio quiere esa
            política, es otra decisión y su lugar es la configuración.
          example: 2022
    VehicleUpdateRequest:
      type: object
      description: >-
        Datos de la moto que el conductor puede corregir. Todos los campos son
        opcionales: solo los que vienen en la request se cambian, el resto
        queda como estaba. No lleva a quién pertenece, igual que el alta — el
        dueño es siempre la cuenta que envía el token y no algo que la entrada
        pueda elegir.

        **Opcional no es vaciable.** Un campo que viene tiene que traer un
        valor: las tres columnas son NOT NULL, y una moto sin placa ni modelo
        no le sirve al pasajero que tiene que reconocerla. La forma de no
        cambiar un dato es no mandarlo.

        Las reglas de cada campo son las mismas del alta (`plate` normalizada y
        única, `model` texto libre, `year` de cuatro dígitos hasta el que viene)
        — un dato corregido no puede quedar en un estado que el alta habría
        rechazado.
      properties:
        plate:
          type: string
          minLength: 5
          maxLength: 10
          description: >-
            Placa del vehículo, única entre todos los conductores. Se normaliza
            igual que en el alta (mayúsculas, sin espacios al borde). Reenviar
            la placa que la moto ya tiene **no** responde 422: la unicidad se
            comprueba ignorando la propia fila, así que un cliente que manda el
            formulario completo sin haber tocado la placa no choca consigo
            mismo.
          pattern: "^[A-Z0-9-]{5,10}$"
          example: ABC12D
        model:
          type: string
          minLength: 1
          maxLength: 100
          description: Modelo de la moto, texto libre. Mismo criterio que el alta.
          example: Bajaj Boxer CT 100 ES
        year:
          type: integer
          minimum: 1970
          description: >-
            Año del modelo, de cuatro dígitos. Mismo rango que el alta: el
            máximo es el año en curso más uno, por eso no se fija acá como
            número.
          example: 2023
    Coordinates:
      type: object
      description: Un punto geográfico.
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 4.710989
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -74.072092
    RideEstimateRequest:
      type: object
      description: Origen y destino entre los que se quiere estimar un viaje.
      required:
        - origin
        - destination
      properties:
        origin:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
    RideEstimate:
      type: object
      description: >-
        Distancia, duración y tarifa estimadas de un trayecto entre dos
        coordenadas, calculadas con el proveedor de mapas y la tarifa
        vigentes.
      required:
        - distance_meters
        - duration_seconds
        - currency
        - estimated_fare
        - is_estimate
      properties:
        distance_meters:
          type: integer
          description: Distancia del trayecto, en metros.
          example: 7421
        duration_seconds:
          type: integer
          description: Duración estimada del trayecto, en segundos.
          example: 842
        currency:
          type: string
          description: Código ISO 4217 de tres letras de la moneda del monto.
          example: COP
        estimated_fare:
          type: integer
          description: >-
            Monto estimado del viaje, entero en la unidad mínima de
            `currency` (ver la nota sobre dinero en config/fares.php).
          example: 8850
        is_estimate:
          type: boolean
          description: >-
            Siempre `true`: este monto no representa un cobro y puede variar
            en el monto final, que se recalcula al completar el viaje con el
            trayecto realmente recorrido.
          example: true
    DriverEarningsSummary:
      type: object
      description: >-
        Lo que ganó un conductor en un rango de fechas, junto con el número de
        viajes completados que componen ese total (historia #30). No incluye
        el detalle viaje por viaje — eso es `GET /me/rides` — ni implica que
        el monto ya se haya liquidado al conductor.
      required:
        - from
        - to
        - currency
        - total_earned
        - completed_rides
      properties:
        from:
          type: string
          format: date
          description: Fecha inicial del rango solicitado (inclusive).
          example: "2026-07-01"
        to:
          type: string
          format: date
          description: Fecha final del rango solicitado (inclusive).
          example: "2026-07-31"
        currency:
          type: string
          description: Código ISO 4217 de tres letras de la moneda del monto.
          example: COP
        total_earned:
          type: integer
          description: >-
            Suma de `final_fare` de los viajes completados del conductor en
            el rango, entero en la unidad mínima de `currency` (ver la nota
            sobre dinero en config/fares.php).
          example: 182400
        completed_rides:
          type: integer
          description: Número de viajes completados que componen `total_earned`.
          example: 21
    RideRequest:
      type: object
      description: >-
        Origen y destino del viaje que el pasajero quiere solicitar.

        Tiene la misma forma que `RideEstimateRequest` a propósito, para que la
        app pueda mandar el mismo cuerpo con el que estimó la tarifa. Son dos
        schemas y no uno porque son la entrada de dos operaciones distintas y
        pueden divergir (un método de pago o una nota para el conductor tendrían
        sentido acá y no en la estimación).
      required:
        - origin
        - destination
      properties:
        origin:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
    Ride:
      type: object
      description: >-
        Un viaje solicitado por un pasajero, con el trayecto y la tarifa que se
        estimaron al crearlo.

        No publica el `passenger_id`: el viaje se solicita siempre desde la
        cuenta que manda el token, igual que el vehículo del conductor. Sí trae
        al conductor asignado en `driver`, que vale `null` mientras el viaje
        sigue en `requested` (lo asigna la historia #18).
      required:
        - id
        - status
        - origin
        - destination
        - distance_meters
        - duration_seconds
        - currency
        - estimated_fare
        - driver
        - requested_at
        - started_at
        - completed_at
        - final_fare
        - payment
      properties:
        id:
          type: integer
          description: >-
            Identificador del viaje. Es el `{rideId}` del canal privado
            `ride.{rideId}` por el que viajan sus cambios de estado.
          example: 1
        status:
          type: string
          description: >-
            Estado del viaje. Nace en `requested`; el resto de los valores los
            producen las historias de aceptar (#18), iniciar (#19), completar
            (#24) y cancelar (#16 antes de aceptar, #22/#23 después).
          enum:
            - requested
            - accepted
            - in_progress
            - completed
            - cancelled
          example: requested
        origin:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
        distance_meters:
          type: integer
          description: Distancia estimada del trayecto al solicitarlo, en metros.
          example: 7421
        duration_seconds:
          type: integer
          description: Duración estimada del trayecto al solicitarlo, en segundos.
          example: 842
        currency:
          type: string
          description: Código ISO 4217 de tres letras de la moneda del monto.
          example: COP
        estimated_fare:
          type: integer
          description: >-
            Monto estimado del viaje al solicitarlo, entero en la unidad mínima
            de `currency` (ver la nota sobre dinero en config/fares.php). No es
            un cobro: el monto final se recalcula al completar el viaje con el
            trayecto realmente recorrido.
          example: 8850
        driver:
          allOf:
            - $ref: "#/components/schemas/RideDriver"
          nullable: true
          description: >-
            El conductor asignado al viaje, o `null` mientras nadie lo haya
            aceptado todavía (historia #21). El campo está siempre presente,
            igual que `started_at`, para que el cliente no tenga que
            distinguir "todavía no hay conductor" de "esta respuesta no lo
            trae".

            Mientras vale `null` tampoco hay ubicación que seguir: la posición
            del conductor no viaja nunca en esta respuesta, solo por el evento
            `location.updated` del canal `ride.{id}`, y ese evento lo publica
            el conductor asignado. Sin conductor no hay nadie publicándolo.
        requested_at:
          type: string
          format: date-time
          description: Momento en que se creó la solicitud.
          example: "2026-07-31T14:03:21+00:00"
        started_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Momento en que el conductor marcó el viaje como iniciado
            (historia #19). Es `null` mientras el viaje no haya empezado, y
            el campo está siempre presente para que el cliente no tenga que
            distinguir "todavía no empezó" de "esta respuesta no lo trae".
          example: null
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Momento en que el conductor marcó el viaje como completado
            (historia #24). Es `null` mientras el viaje no haya terminado, y
            el campo está siempre presente por el mismo motivo que
            `started_at`.
          example: null
        final_fare:
          type: integer
          nullable: true
          description: >-
            Monto final del viaje, entero en la unidad mínima de `currency`,
            recalculado al completarlo (historia #24) con el trayecto
            realmente recorrido en vez del estimado al solicitarlo. Es
            `null` mientras el viaje no esté `completed`. No es en sí mismo
            el resultado del cobro —eso lo publica `payment`—, solo el monto
            que corresponde cobrar.
          example: null
        payment:
          allOf:
            - $ref: "#/components/schemas/Payment"
          nullable: true
          description: >-
            El cobro del viaje (historia #25), o `null` mientras el viaje no
            esté `completed`. El campo está siempre presente, mismo criterio
            que `driver` y `started_at`, para que el cliente no tenga que
            distinguir "todavía no se completó" de "esta respuesta no lo
            trae".
          example: null
    RideDriver:
      type: object
      description: >-
        El conductor asignado a un viaje, visto desde el viaje (historia #21).

        Es deliberadamente más chico que `User`: acá el que mira es la
        contraparte del viaje, no el dueño de la cuenta. Va lo mínimo para
        saber a quién se está esperando; el teléfono y los datos de la moto
        (placa, modelo) no entran todavía porque ninguna historia los pidió, y
        publicar el contacto de una persona a la otra es una decisión de
        producto, no un detalle de serialización.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: >-
            Id de la cuenta del conductor. Es el mismo id de `User` que usa
            el canal privado `driver.{driverId}`.
          example: 42
        name:
          type: string
          description: Nombre con el que el conductor se registró.
          example: Carlos Pérez
    Payment:
      type: object
      description: >-
        El cobro de un viaje completado, visto desde el viaje (historia #25).

        No repite `amount` ni `currency`: son el `final_fare` y `currency`
        que ya trae el viaje que contiene este objeto, y el pago no puede
        valer un monto distinto del que se calculó al completarlo.
      required:
        - status
      properties:
        status:
          type: string
          description: >-
            Resultado del cobro. `paid` cuando el proveedor de pago lo
            confirmó, `failed` cuando lo rechazó o no se lo pudo contactar
            —eso no bloquea que el viaje quede `completed`—. `pending` no lo
            produce hoy ningún flujo (el cobro se procesa de forma síncrona
            al completar el viaje), pero es parte del contrato para cuando
            se integre un proveedor real asíncrono.
          enum:
            - pending
            - paid
            - failed
          example: paid
    RideReceipt:
      type: object
      description: >-
        El recibo de un viaje completado (historia #26): el desglose que
        produjo el cobro publicado en `Ride.payment` / `Ride.final_fare`.

        A diferencia de `Payment` embebido en `Ride`, acá sí repite
        `currency` y `total`: este objeto es el recurso principal de la
        respuesta y tiene que bastarse solo, sin depender de que el cliente
        ya tenga el viaje cargado.
      required:
        - ride_id
        - currency
        - base_fare
        - distance_fare
        - time_fare
        - waiting_fee
        - subtotal
        - minimum_applied
        - total
        - payment_status
        - completed_at
      properties:
        ride_id:
          type: integer
          description: Identificador del viaje al que pertenece este recibo.
          example: 1
        currency:
          type: string
          description: Código ISO 4217 de tres letras de la moneda de los montos.
          example: COP
        base_fare:
          type: integer
          description: >-
            Lo que cuesta el viaje antes de moverse, entero en la unidad
            mínima de `currency` (ver config/fares.php).
          example: 1500
        distance_fare:
          type: integer
          description: Cargo por la distancia realmente recorrida.
          example: 5937
        time_fare:
          type: integer
          description: Cargo por el tiempo en ruta realmente transcurrido.
          example: 1000
        waiting_fee:
          type: integer
          description: >-
            Cargo por espera solicitada por el pasajero con el viaje ya
            aceptado, fuera de la duración del trayecto. Hoy siempre vale 0:
            ninguna historia implementada todavía registra tiempo de espera.
          example: 0
        subtotal:
          type: integer
          description: >-
            Suma de `base_fare`, `distance_fare`, `time_fare` y
            `waiting_fee`, antes de aplicar el piso mínimo y el redondeo.
          example: 8437
        minimum_applied:
          type: boolean
          description: >-
            `true` cuando `subtotal` no llegaba al mínimo configurado y
            `total` quedó determinado por ese piso en vez de la suma de
            conceptos.
          example: false
        total:
          type: integer
          description: >-
            Monto cobrado, entero en la unidad mínima de `currency`. Es el
            mismo valor que `Ride.final_fare` para este viaje.
          example: 8450
        payment_status:
          type: string
          description: Resultado del cobro, mismo significado que `Payment.status`.
          enum:
            - pending
            - paid
            - failed
          example: paid
        completed_at:
          type: string
          format: date-time
          description: Momento en que el conductor marcó el viaje como completado.
          example: "2026-07-31T14:19:05+00:00"
    RideRating:
      type: object
      description: >-
        La calificación que el pasajero da al conductor de un viaje ya
        completado (historia #27). Se basta sola, sin depender de que el
        cliente ya tenga el viaje cargado, mismo criterio que `RideReceipt`.
      required:
        - ride_id
        - score
        - rated_at
      properties:
        ride_id:
          type: integer
          description: Identificador del viaje al que pertenece esta calificación.
          example: 1
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: Puntuación de 1 (peor) a 5 (mejor) que dio el pasajero.
          example: 5
        comment:
          type: string
          nullable: true
          description: Comentario libre que dejó el pasajero, o `null` si no dejó ninguno.
          example: Muy puntual y buen trato.
        rated_at:
          type: string
          format: date-time
          description: Momento en que se registró la calificación.
          example: "2026-07-31T14:20:05+00:00"
    BroadcastAuthRequest:
      type: object
      description: >-
        Cuerpo que manda el SDK del cliente al suscribirse a un canal privado.
        Los nombres de los campos los fija el protocolo Pusher que habla
        Reverb, no esta API.
      required:
        - socket_id
        - channel_name
      properties:
        socket_id:
          type: string
          description: Identificador de la conexión WebSocket que asignó Reverb.
          example: "123456.789012"
        channel_name:
          type: string
          description: >-
            Nombre del canal en el cable, con el prefijo `private-` que agrega
            el cliente. Canales definidos hoy: `private-ride.{rideId}` y
            `private-driver.{driverId}`.
          example: private-driver.1
    BroadcastAuthResponse:
      type: object
      description: >-
        Firma que el cliente reenvía a Reverb para completar la suscripción.
      required:
        - auth
      properties:
        auth:
          type: string
          description: "Firma HMAC del par `socket_id:channel_name`, en formato `<app_key>:<hmac>`."
    Error:
      type: object
      description: Formato de error de la API (exception handler de Laravel).
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: object
          description: Presente solo en errores de validación (422).
          additionalProperties:
            type: array
            items:
              type: string
