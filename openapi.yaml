openapi: 3.0.3
info:
  title: MotoYa API
  description: >-
    API REST del backend de MotoYa (solicitud de transporte tipo moto-taxi).
    Este archivo es la fuente de verdad del contrato de la API: se actualiza
    en el paso de SDD de cada feature, antes de escribir tests o código (ver
    .claude/skills/laravel-feature-workflow/SKILL.md y .claude/STANDARDS.md).
  version: "0.1.0"
servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
paths:
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Renovar el access token
      description: >-
        Emite un nuevo access token a partir del token enviado en la cabecera
        `Authorization: Bearer`. A diferencia del resto de endpoints protegidos,
        acepta un token **ya expirado**, siempre que siga dentro de la ventana
        de refresh (`JWT_REFRESH_TTL`, 14 días desde la emisión original). El
        token usado queda invalidado al renovarlo, pero con un periodo de
        gracia de 30 s (`JWT_BLACKLIST_GRACE_PERIOD`) durante el cual sigue
        siendo aceptado, para que las requests que ya iban en vuelo cuando el
        cliente renovó no se caigan (ver .claude/STANDARDS.md).

        El endpoint está limitado a 10 requests por minuto e IP: no lleva
        `auth:api`, así que cualquiera puede invocarlo sin credenciales.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token renovado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AuthToken"
              example:
                data:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsInJvbGUiOiJwYXNzZW5nZXIifQ.4pcPyMD09olPSyXnrXCjTwXyr4BsezdI1AVTmud2fU4
                  token_type: bearer
                  expires_in: 900
        "401":
          description: >-
            Falta el token, es inválido, o el plazo para renovarlo ya venció y
            hay que autenticarse de nuevo con credenciales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Token inválido o expirado. Inicia sesión de nuevo.
        "429":
          description: >-
            Se superó el límite de renovaciones por minuto para esta IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /auth/register/passenger:
    post:
      tags:
        - Auth
      operationId: registerPassenger
      summary: Registrar una cuenta de pasajero
      description: >-
        Crea una cuenta con rol `passenger` y devuelve, en la misma respuesta,
        un access token válido: la app móvil queda autenticada sin tener que
        encadenar un login inmediatamente después del registro.

        El rol **no** se acepta como entrada — lo fija el endpoint. Registrarse
        como conductor es otro endpoint (historia #7), porque además del rol
        exige los datos del perfil de conductor.

        No requiere autenticación, y por eso comparte con el resto de
        endpoints de auth el límite de 10 requests por minuto e IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassengerRegistrationRequest"
            example:
              name: Ana García
              email: ana@example.com
              phone: "+573001234567"
              password: motoya2026
      responses:
        "201":
          description: Cuenta creada y sesión iniciada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AuthenticatedUser"
              example:
                data:
                  user:
                    id: 1
                    name: Ana García
                    email: ana@example.com
                    phone: "+573001234567"
                    role: passenger
                  token:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsInJvbGUiOiJwYXNzZW5nZXIifQ.4pcPyMD09olPSyXnrXCjTwXyr4BsezdI1AVTmud2fU4
                    token_type: bearer
                    expires_in: 900
        "422":
          description: >-
            La entrada no pasó la validación: falta un campo requerido, el
            email o el teléfono ya están registrados, o la contraseña no
            cumple la política mínima.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: The email has already been taken.
                errors:
                  email:
                    - The email has already been taken.
        "429":
          description: >-
            Se superó el límite de requests por minuto para esta IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
  /broadcasting/auth:
    post:
      tags:
        - Realtime
      operationId: authorizeBroadcastChannel
      summary: Autorizar la suscripción a un canal privado
      description: >-
        Firma la suscripción del cliente a un canal privado de Reverb. El SDK
        del cliente (Laravel Echo / pusher-js) llama a este endpoint por su
        cuenta cada vez que se suscribe a un canal `private-*`, mandando el
        `socket_id` de su conexión con el servidor de WebSockets y el nombre
        del canal.

        La autorización de cada canal está en `routes/channels.php`
        (`ride.{rideId}` y `driver.{driverId}`): responde 403 si el usuario
        autenticado no participa de esa entidad. Requiere un access token
        vigente — a diferencia del refresh, acá el token expirado no sirve.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastAuthRequest"
            example:
              socket_id: "123456.789012"
              channel_name: private-driver.1
      responses:
        "200":
          description: >-
            Suscripción autorizada. La firma se devuelve tal cual la espera el
            cliente (formato del protocolo Pusher que habla Reverb), sin el
            envelope `data` del resto de la API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastAuthResponse"
              example:
                auth: "motoya-local:8f3c1a2b4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7081920a1b2c3d4e5f"
        "401":
          description: Falta el access token o ya no es válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Unauthenticated.
        "403":
          description: >-
            El usuario autenticado no tiene permiso sobre la entidad del canal
            (no es el conductor de `driver.{id}`, o no participa del viaje de
            `ride.{id}`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: This action is unauthorized.
        "429":
          description: Se superó el límite general de la API para este usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Too Many Attempts.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthToken:
      type: object
      description: >-
        Access token JWT emitido por la API. Viaja dentro del envelope `data`
        que agregan los API Resources de Laravel (ver .claude/STANDARDS.md).
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: "JWT firmado que el cliente envía en la cabecera `Authorization: Bearer`."
        token_type:
          type: string
          enum:
            - bearer
        expires_in:
          type: integer
          nullable: true
          description: >-
            Segundos que faltan para que el access token expire, calculados
            sobre el claim `exp` del token emitido. Es `null` cuando el token
            no expira (`JWT_TTL` sin valor).
          example: 900
    User:
      type: object
      description: >-
        Datos públicos de una cuenta. Nunca incluye la contraseña (el modelo la
        declara en `$hidden`).
      required:
        - id
        - name
        - email
        - phone
        - role
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ana García
        email:
          type: string
          format: email
          example: ana@example.com
        phone:
          type: string
          example: "+573001234567"
        role:
          type: string
          description: >-
            Rol de autenticación de la cuenta (ver la decisión de modelo de
            datos en .claude/STANDARDS.md). Sirve para que el cliente sepa qué
            UI mostrar; la autorización de negocio se resuelve con Policies en
            el servidor, no con este campo.
          enum:
            - passenger
            - driver
          example: passenger
    AuthenticatedUser:
      type: object
      description: >-
        Cuenta más el access token con el que quedó autenticada. Es la
        respuesta común del registro y del login.
      required:
        - user
        - token
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          $ref: "#/components/schemas/AuthToken"
    PassengerRegistrationRequest:
      type: object
      description: >-
        Datos con los que se da de alta un pasajero. El rol no se manda: lo
        fija el endpoint.
      required:
        - name
        - email
        - phone
        - password
      properties:
        name:
          type: string
          maxLength: 255
          example: Ana García
        email:
          type: string
          format: email
          maxLength: 255
          description: >-
            Único entre todas las cuentas. Se normaliza a minúsculas antes de
            validarlo y de guardarlo, así que `Ana@example.com` y
            `ana@example.com` son la misma cuenta (la segunda alta responde
            422).
          example: ana@example.com
        phone:
          type: string
          maxLength: 20
          description: >-
            Único entre todas las cuentas. Se acepta en formato E.164 (`+` y
            de 7 a 15 dígitos); el `+` es opcional en la entrada, pero el
            número se guarda y se devuelve siempre con él. Es decir,
            `573001234567` y `+573001234567` son el mismo número y el segundo
            registro responde 422.
          example: "+573001234567"
        password:
          type: string
          format: password
          minLength: 8
          description: >-
            Mínimo 8 caracteres, con al menos una letra y al menos un número
            (ver la política en .claude/STANDARDS.md).
          example: motoya2026
    BroadcastAuthRequest:
      type: object
      description: >-
        Cuerpo que manda el SDK del cliente al suscribirse a un canal privado.
        Los nombres de los campos los fija el protocolo Pusher que habla
        Reverb, no esta API.
      required:
        - socket_id
        - channel_name
      properties:
        socket_id:
          type: string
          description: Identificador de la conexión WebSocket que asignó Reverb.
          example: "123456.789012"
        channel_name:
          type: string
          description: >-
            Nombre del canal en el cable, con el prefijo `private-` que agrega
            el cliente. Canales definidos hoy: `private-ride.{rideId}` y
            `private-driver.{driverId}`.
          example: private-driver.1
    BroadcastAuthResponse:
      type: object
      description: >-
        Firma que el cliente reenvía a Reverb para completar la suscripción.
      required:
        - auth
      properties:
        auth:
          type: string
          description: "Firma HMAC del par `socket_id:channel_name`, en formato `<app_key>:<hmac>`."
    Error:
      type: object
      description: Formato de error de la API (exception handler de Laravel).
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: object
          description: Presente solo en errores de validación (422).
          additionalProperties:
            type: array
            items:
              type: string
